# Tauri v2 スケルトン。PC 専用 MVP（Windows/WebView2 を主対象）。
# ※ Sprint1 では cargo build / tauri build は実行しない（設定と最小 main.rs の用意まで）。
[package]
name = "mamorai-desktop"
version = "0.1.0"
description = "MAMOR-AI desktop shell (Tauri v2, WebView2, PC-only MVP)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "mamorai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
